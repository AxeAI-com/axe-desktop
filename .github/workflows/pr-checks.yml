# The Axe desktop app (next/): typecheck, lint and unit tests on every PR and push to master.
# On GitHub's hosted runners (Linux, with a virtual display for Electron). The end-to-end tests drive
# the real Electron app with macOS screenshots, so they stay a local check (pnpm test:e2e) before a release.
name: PR checks
on:
  pull_request:
    paths: ["next/**", ".github/workflows/pr-checks.yml"]
  push:
    branches: [master]
    paths: ["next/**", ".github/workflows/pr-checks.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: next
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: next/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: xvfb-run -a pnpm test
