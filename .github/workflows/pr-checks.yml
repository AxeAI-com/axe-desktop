# The Axe desktop app (next/): typecheck, lint and unit tests on every PR and push to master.
# On a self-hosted runner, not GitHub's
# machines: no paid minutes. Only PRs from branches in this repo run here, never from forks. The end-to-end
# tests drive the real Electron app with macOS screenshots, so they stay a local check
# (pnpm test:e2e) before a release.
name: PR checks
on:
  pull_request:
    paths: ["next/**", ".github/workflows/pr-checks.yml"]
  push:
    branches: [master]
    paths: ["next/**", ".github/workflows/pr-checks.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Fork PRs never run on the self-hosted runner: a maintainer pushes the branch to this repo to run checks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, axeai-mac-ci]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: next
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: next/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm test
